[package]
name = "nightscout-waybar-module"
version = "1.0.0"
edition = "2024"
authors = ["circusreal"]
description = "Output NightScout data in JSON for a Waybar custom module"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/circus-real/nightscout-waybar-module"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2", features = ["json"] }